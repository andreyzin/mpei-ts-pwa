name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  # Монорепозиторий собирает три независимых образа. Сборка у них отличается
  # только каталогом, поэтому это матрица, а не скопированные блоки.
  # target не указан: в обоих Dockerfile production — последняя стадия.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, bot]

    steps:
      - uses: actions/checkout@v4

      # Без своего билдера сборка идёт на драйвере docker, который не умеет
      # экспортировать кэш: cache-to ниже падает с "Cache export is not
      # supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # Короткий sha — без префикса sha-, чтобы тег совпадал с тем,
          # что показывает git log. latest двигается только с main.
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          # Нужны только фронтенду: Vite вшивает их в сборку. Переменные
          # репозитория (Settings → Variables); пустые — аналитика выключена.
          build-args: |
            VITE_UMAMI_SCRIPT_URL=${{ vars.UMAMI_SCRIPT_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
