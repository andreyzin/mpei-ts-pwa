services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # Empty keeps analytics and its consent banner off.
      VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SUGGESTIONS_CHAT_ID: ${SUGGESTIONS_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional services, started with a profile:
  #   docker compose --profile bot up        Telegram bot (+ postgres)
  #   docker compose --profile analytics up  Umami on :3000 (+ postgres)
  postgres:
    image: postgres:17-alpine
    profiles: [bot, analytics]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpei}
      POSTGRES_DB: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: ./bot
      target: development
    profiles: [bot]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mpei}:${POSTGRES_PASSWORD:-mpei}@postgres:5432/bot
      SCHEDULE_API_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      APP_URL: ${APP_URL:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      # http://localhost or empty: long polling; https://...: webhook on :8080.
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - ./bot:/app
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    profiles: [analytics]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mpei}:${POSTGRES_PASSWORD:-mpei}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-local-development-secret}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  frontend_node_modules:
  postgres_data:

